# studentctl panel — container deployment with nginx + automatic HTTPS.
# The Linux playground stays on the host (PAM/cgroups/quota/ufw need the kernel);
# only the Flask panel runs in a container, behind nginx.
#
# First time (HTTPS):
#   sudo DOMAIN=panel.yourdomain.ir EMAIL=you@example.com bash deploy/init-letsencrypt.sh
#   docker compose up -d
# Without a domain (HTTP only, local/tunnel): see deploy/deploy_panel.sh
#
services:
  panel:
    build: ./panel
    image: studentctl-panel:latest
    container_name: studentctl-panel
    restart: unless-stopped
    env_file: ./panel/panel.env
    environment:
      TZ: Asia/Tehran
    expose:
      - "5000"                       # internal only; nginx proxies to it
    volumes:
      - panel-data:/var/lib/studentctl   # SQLite DB + generated SSH key persist here
    extra_hosts:
      - "host.docker.internal:host-gateway"   # SSH to the host playground if colocated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: studentctl-nginx
    restart: unless-stopped
    ports:
      - "80:80"                      # HTTP  -> ACME challenge + redirect to HTTPS
      - "443:443"                    # HTTPS -> panel:5000
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro   # envsubst -> conf.d
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - panel

  certbot:
    image: certbot/certbot
    container_name: studentctl-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Try to renew every 12h; nginx reloads the new cert on its own restart cycle.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  panel-data:
