# nginx runs on the 4GB LINUX PLAYGROUND box (the one DNS points "panel.domain" at).
# It forwards https://panel.domain  ->  the Flask panel on the SMALL VM.
#
# Deploy (on the 4GB box):
#   sudo apt-get install -y nginx
#   sudo cp nginx_panel.conf /etc/nginx/sites-available/panel.conf
#   sudo sed -i 's/PANEL_DOMAIN/panel.yourdomain.ir/g; s/SMALL_VM_IP/10.0.0.20/g' \
#       /etc/nginx/sites-available/panel.conf
#   sudo ln -s /etc/nginx/sites-available/panel.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 80/tcp && sudo ufw allow 443/tcp
#
# For HTTPS (recommended), after the HTTP block below is live:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d panel.yourdomain.ir
# (certbot will rewrite this file to add the 443 server block + redirect.)

# Increase upload/body limits if you ever add file features
client_max_body_size 8m;

# Upstream = the Flask panel on the small VM (waitress on :5000)
upstream studentctl_panel {
    server SMALL_VM_IP:5000;
}

server {
    listen 80;
    listen [::]:80;
    server_name PANEL_DOMAIN;

    # Only the panel is proxied. Everything else goes to the Flask app.
    location / {
        proxy_pass         http://studentctl_panel;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Don't cache dynamic pages
    location ~* \.(?:css|js)$ {
        proxy_pass http://studentctl_panel;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }
}
