# Optional: nginx on the SAME box, in front of the panel container.
# Terminates TLS for https://panel.yourdomain.ir and proxies to the container's
# 127.0.0.1:5000. Only needed if you want HTTPS; otherwise reach :5000 directly
# (e.g. via SSH tunnel).
#
# Deploy:
#   sudo apt-get install -y nginx
#   sudo cp nginx_panel.conf /etc/nginx/sites-available/panel.conf
#   sudo sed -i 's/PANEL_DOMAIN/panel.yourdomain.ir/g' \
#       /etc/nginx/sites-available/panel.conf
#   sudo ln -s /etc/nginx/sites-available/panel.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 80/tcp && sudo ufw allow 443/tcp
#
# For HTTPS, after the HTTP block below is live:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d panel.yourdomain.ir
# (certbot rewrites this file to add the 443 server block + redirect.)

client_max_body_size 8m;

# The panel container is bound to 127.0.0.1:5000 (see docker-compose.yml).
upstream studentctl_panel {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    listen [::]:80;
    server_name PANEL_DOMAIN;

    location / {
        proxy_pass         http://studentctl_panel;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
